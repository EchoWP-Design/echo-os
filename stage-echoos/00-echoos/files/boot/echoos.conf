# =====================================================================
#  Echo-OS – Grundeinstellungen
#
#  Diese Datei liegt nach dem Flashen auf der Partition "bootfs" und
#  kann am PC mit jedem Texteditor bearbeitet werden.
#  Passwörter und API-Schlüssel werden beim nächsten Start übernommen
#  und anschließend hier automatisch gelöscht.
# =====================================================================

[system]
hostname = echo-os
timezone = Europe/Berlin
# Optional: Passwort für den Benutzer "echoos" (sonst zufällig).
password =

[wlan]
# Leer lassen, wenn der Pi per Netzwerkkabel angeschlossen ist.
country = DE
ssid =
password =

[ssh]
# Öffentlicher SSH-Schlüssel (z. B. Inhalt von ~/.ssh/id_ed25519.pub).
# Nur wenn hier ein Schlüssel steht, wird SSH aktiviert – Passwort-Login
# bleibt immer aus.
public_key =

[agent]
# API-Schlüssel aus der Claude Console (https://platform.claude.com/settings/keys).
# Ohne Schlüssel versteht der Agent nur einfache Befehle (Pause, Stopp, Netflix …).
claude_api_key =
# Nur nötig, wenn der Schlüssel keinem Workspace zugeordnet ist (wrkspc_…).
workspace_id =
model = claude-haiku-5-5
# Nachts um 4 Uhr neu starten, wenn ein Update das verlangt und nichts läuft.
auto_reboot = yes
