name: Echo-App (Android)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
      - "stage-echoos/00-echoos/files/rootfs/usr/share/echoos/services.json"
      - "stage-echoos/00-echoos/files/rootfs/usr/local/lib/echoos/gen_*.py"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Werkzeuge
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-pil fonts-dejavu-core
      - name: Grafiken und Diensteliste aus Echo-OS erzeugen
        run: python3 tool/make_assets.py
      - name: Android-Projekt erzeugen und für Fire TV anpassen
        run: |
          flutter create --platforms=android --org de.echowp --project-name echo_app .
          python3 tool/patch_android.py
      - name: Pakete
        run: flutter pub get
      - name: Analyse
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Signatur
        env:
          KEYSTORE_B64: ${{ secrets.ECHO_APP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ECHO_APP_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/echo.jks
            PW="$KEYSTORE_PASSWORD"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            # Ohne festen Schlüssel: Test-APK mit Einmal-Schlüssel (Updates nur nach Deinstallation)
            PW="test-$(openssl rand -hex 12)"
            keytool -genkeypair -keystore android/app/echo.jks -alias echo -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Echo-App Test"
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi
          printf 'storeFile=echo.jks\nstorePassword=%s\nkeyAlias=echo\nkeyPassword=%s\n' "$PW" "$PW" > android/key.properties
      - name: APK bauen (ARM 32 und 64 Bit, für Fire TV und Handys)
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          flutter build apk --release --build-number ${{ github.run_number }} \
            --dart-define=APP_VERSION="$VERSION" --dart-define=APP_BUILD=${{ github.run_number }}
          mkdir -p ../dist
          if [ "$SIGNED" = 1 ]; then NAME=EchoApp.apk; else NAME=EchoApp-Test.apk; fi
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/$NAME"
          ls -la ../dist
          rm -f android/app/echo.jks android/key.properties
      - uses: actions/upload-artifact@v5
        with:
          name: echo-app
          path: dist/*.apk
      - name: Am Release anhängen
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EchoApp.apk
