name: Echo-OS Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  funktionstests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Skripte ausführbar machen (Uploads von Windows verlieren das Ausführungsrecht)
        run: chmod +x build.sh tests/*.sh tests/*.py tests/vm/* tests/fakebin/*
      - name: Werkzeuge
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-pil fonts-dejavu-core ffmpeg shellcheck
      - name: Shellcheck
        continue-on-error: true
        run: |
          shellcheck -S warning build.sh stage-echoos/prerun.sh stage-echoos/00-echoos/*.sh \
            stage-echoos/00-echoos/files/rootfs/usr/local/lib/echoos/automount.sh \
            stage-echoos/00-echoos/files/rootfs/usr/local/bin/echoos-browser
      - name: Funktionstests (Agent, Addon, Konfiguration, Kacheln)
        run: python3 tests/test_all.py
      - name: Web-Oberfläche in Chrome aufnehmen
        run: tests/run_ui_demo.sh
      - name: Bootscreen-Simulation rendern
        run: |
          python3 stage-echoos/00-echoos/files/rootfs/usr/local/lib/echoos/gen_bootscreen.py tests/out/boot/theme
          python3 tests/simulate_plymouth.py tests/out/boot/theme tests/out/boot/bootscreen_1080p.mp4
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: funktionstests
          path: tests/out

  visueller-test-echt:
    # Echtes Plymouth + echtes Kodi + echtes Laufwerk in einer virtuellen Anzeige
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Visueller Test
        run: bash tests/ci_visual_test.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: visueller-test-plymouth-kodi
          path: tests/out/ci
